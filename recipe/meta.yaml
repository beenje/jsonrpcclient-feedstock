{% set name = "jsonrpcclient" %}
{% set version = "4.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 353cb7431610c545a451a6da285c2c21c0e4a8040333543da26c7c07bbb3fa80

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python

requirements:
  host:
    - pip
    - flit-core >=3.12,<5
    - python {{ python_min }}
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - jsonrpcclient
  commands:
    - pip check

about:
  home: https://bensynapse.github.io/jsonrpcclient/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Create JSON-RPC 2.0 requests and parse responses in Python.
  doc_url: https://bensynapse.github.io/jsonrpcclient/
  dev_url: https://github.com/bensynapse/jsonrpcclient

extra:
  recipe-maintainers:
    - bcb
    - beenje
    - bensynapse
