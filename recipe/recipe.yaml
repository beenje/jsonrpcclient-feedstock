schema_version: 1

context:
  name: jsonrpcclient
  version: "4.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 353cb7431610c545a451a6da285c2c21c0e4a8040333543da26c7c07bbb3fa80

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - flit-core >=3.12,<5
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jsonrpcclient
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: MIT
  license_file: LICENSE
  summary: Create JSON-RPC 2.0 requests and parse responses in Python.
  homepage: https://bensynapse.github.io/jsonrpcclient/
  repository: https://github.com/bensynapse/jsonrpcclient
  documentation: https://bensynapse.github.io/jsonrpcclient/

extra:
  recipe-maintainers:
    - bcb
    - beenje
    - bensynapse
